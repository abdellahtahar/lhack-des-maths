<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#0C0912">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

<div id="slot-nav"></div>

<section class="entete-page">
  <div class="wrap">
    <nav class="fil">
      <a href="index.html">Accueil</a><i>/</i>
      <a href="index.html#niveaux">Niveaux</a><i>/</i>
      <b id="fil-niv">—</b>
    </nav>
    <span class="badge-niv" id="badge">—</span>
    <h1 id="titre">—</h1>
    <p id="sous">—</p>
  </div>
</section>

<section class="section" style="padding-top:38px">
  <div class="wrap">
    <div class="rev" style="margin-bottom:28px">
      <span class="kicker">Étape 2</span>
      <h2 class="h-sec" style="font-size:clamp(24px,3.6vw,36px)">Qu'est-ce que tu cherches ?</h2>
    </div>
    <div class="grille-rayons" id="grille-rayons"></div>

    <div class="rev" style="margin-top:44px; display:flex; gap:12px; flex-wrap:wrap; align-items:center">
      <a href="bibliotheque.html" class="btn btn-3" id="btn-tout">Voir tous les documents de ce niveau</a>
      <a href="index.html#niveaux" class="btn btn-ghost">← Changer de niveau</a>
    </div>
  </div>
</section>

<div id="slot-pied"></div>

<script src="js/data.js?v=6"></script>
<script src="js/app.js?v=6"></script>
<script>
function avantInteractions(){
  const slug = params.get('n');
  const niv  = niveauParSlug(slug);

  if (!niv){
    document.getElementById('titre').textContent = 'Niveau introuvable';
    document.getElementById('sous').textContent  = 'Reviens à l\'accueil pour choisir un niveau.';
    document.getElementById('badge').style.display = 'none';
    return;
  }

  document.title = niv.court + ' — L\'Hack Des Maths';
  document.getElementById('fil-niv').textContent = niv.court;
  document.getElementById('badge').textContent   = niv.court;
  document.getElementById('titre').innerHTML     = niv.nom + ' <span class="violet-txt">' + niv.sous + '</span>';
  const n = nbDocs(slug);
  document.getElementById('sous').textContent =
    n ? n + ' document' + (n>1?'s':'') + ' disponibles dans ce niveau.'
      : 'Les documents de ce niveau arrivent très bientôt.';

  document.getElementById('btn-tout').href = 'bibliotheque.html?n=' + slug;

  rendreRayons('#grille-rayons', slug);
}
</script>
</body>
</html>
