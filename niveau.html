<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choisir un rayon — L'Hack Des Maths</title>
<meta name="description" content="Cours, exercices ou devoirs : choisissez votre rayon pour ce niveau.">
<meta name="theme-color" content="#0C0912">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<div id="slot-nav"></div>

<section class="entete-page">
  <div class="wrap">
    <nav class="fil-ariane" id="ariane"></nav>
    <span class="badge-niv" id="badge">—</span>
    <h1 id="titre">—</h1>
    <p id="sous">—</p>
  </div>
</section>

<section class="section" style="padding-top:38px">
  <div class="wrap">
    <div class="rev" style="margin-bottom:28px">
      <span class="kicker">Étape 4</span>
      <h2 class="h-sec" style="font-size:clamp(24px,3.6vw,36px)">Qu'est-ce que tu cherches ?</h2>
    </div>
    <div class="grille-rayons" id="grille-rayons"></div>

    <div class="rev" style="margin-top:44px; display:flex; gap:12px; flex-wrap:wrap; align-items:center">
      <a href="bibliotheque.html" class="btn btn-3" id="btn-tout">Voir tous les documents de ce niveau</a>
      <a href="#" class="btn btn-ghost" id="btn-retour">← Changer de filière</a>
    </div>
  </div>
</section>

<div id="slot-pied"></div>

<script src="js/data.js?v=7"></script>
<script src="js/app.js?v=7"></script>
<script>
function avantInteractions(){
  const slug = params.get('n');
  const niv  = niveauParSlug(slug);

  if (!niv){
    document.getElementById('titre').textContent = 'Niveau introuvable';
    document.getElementById('sous').textContent  = 'Reviens à l\'accueil pour choisir ton niveau.';
    document.getElementById('ariane').innerHTML  = '<a href="index.html">Accueil</a>';
    document.getElementById('badge').style.display = 'none';
    return;
  }

  document.title = niv.court + ' — L\'Hack Des Maths';

  /* Fil d'Ariane complet : Accueil / Cycle / Année / Filière */
  const groupe = anneesDe(niv.cycle).find(a => a.id === niv.annee);
  const nomAnnee = groupe ? groupe.nom.replace(/<[^>]+>/g,'') : '';
  const lienCycle = 'niveaux.html?c=' + encodeURIComponent(niv.cycle);
  const lienRetour = (groupe && groupe.niveaux.length > 1)
    ? lienCycle + '&a=' + niv.annee
    : lienCycle;

  document.getElementById('ariane').innerHTML =
    `<a href="index.html">Accueil</a><i>/</i>` +
    `<a href="${lienCycle}">${niv.cycle}</a><i>/</i>` +
    (nomAnnee ? `<a href="${lienRetour}">${nomAnnee}</a><i>/</i>` : '') +
    `<b>${niv.court}</b>`;

  const br = document.getElementById('btn-retour');
  br.href = lienRetour;
  br.textContent = (groupe && groupe.niveaux.length > 1) ? '← Changer de filière' : '← Changer d\'année';
  document.getElementById('badge').textContent   = niv.court;
  document.getElementById('titre').innerHTML     = (niv.anneeNom || niv.court) + ' <span class="violet-txt">' + (niv.filiere || niv.sous) + '</span>';
  const n = nbDocs(slug);
  document.getElementById('sous').textContent =
    n ? n + ' document' + (n>1?'s':'') + ' disponibles dans ce niveau.'
      : 'Les documents de ce niveau arrivent très bientôt.';

  document.getElementById('btn-tout').href = 'bibliotheque.html?n=' + slug;

  rendreRayons('#grille-rayons', slug);
}
</script>
</body>
</html>
