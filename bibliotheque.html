<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliothèque — L'Hack Des Maths</title>
<meta name="description" content="Tous les cours, exercices et devoirs de mathématiques en PDF, à télécharger gratuitement.">
<meta name="theme-color" content="#0C0912">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236722A0'/><text x='50' y='72' font-size='64' font-family='Georgia' text-anchor='middle' fill='%23FFD900'>∑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="slot-nav"></div>

<section class="entete-page">
  <div class="wrap">
    <nav class="fil" id="fil">
      <a href="index.html">Accueil</a><i>/</i>
      <a href="index.html#niveaux">Niveaux</a>
    </nav>
    <span class="badge-niv" id="badge">Bibliothèque</span>
    <h1 id="titre">Tous les documents</h1>
    <p id="sous">—</p>
  </div>
</section>

<section class="section" style="padding-top:34px">
  <div class="wrap">

    <div class="barre-outils rev">
      <div class="recherche">
        <span id="ico-loupe"></span>
        <input type="search" id="q" placeholder="Chercher un chapitre, un titre…" autocomplete="off">
      </div>
      <div class="puces" id="puces">
        <button class="puce on" data-t="">Tout</button>
        <button class="puce" data-t="cours">Cours</button>
        <button class="puce" data-t="exercices">Exercices</button>
        <button class="puce" data-t="devoirs">Devoirs</button>
      </div>
    </div>

    <div class="liste-docs" id="liste"></div>

    <div style="margin-top:40px; display:flex; gap:12px; flex-wrap:wrap">
      <a href="#" class="btn btn-3" id="retour">← Retour aux rayons</a>
      <a href="index.html#niveaux" class="btn btn-ghost">Changer de niveau</a>
    </div>

  </div>
</section>

<div id="slot-pied"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let ETAT = { slug:null, type:'', q:'' };

function dessineListe(){
  const box = document.getElementById('liste');
  let liste = DOCUMENTS.filter(d =>
    (!ETAT.slug || d.niveau === ETAT.slug) &&
    (!ETAT.type || d.type === ETAT.type)
  );

  if (ETAT.q){
    const q = ETAT.q.toLowerCase();
    liste = liste.filter(d =>
      (d.titre + ' ' + (d.chapitre||'') + ' ' + (niveauParSlug(d.niveau)?.court||'')).toLowerCase().includes(q)
    );
  }

  liste.sort((a,b) => (b.date||'').localeCompare(a.date||''));

  box.innerHTML = liste.length
    ? liste.map(carteDoc).join('')
    : `<div class="vide">
         <div class="em">✎</div>
         <h3>Aucun document ici pour l'instant</h3>
         <p>Ce rayon se remplit régulièrement. Reviens bientôt, ou essaie un autre filtre.</p>
       </div>`;

  box.querySelectorAll('.rev').forEach((el,i) => setTimeout(() => el.classList.add('vu'), 40 + i*45));
}

function avantInteractions(){
  ETAT.slug = params.get('n');
  ETAT.type = params.get('t') || '';

  const niv = niveauParSlug(ETAT.slug);

  document.getElementById('ico-loupe').innerHTML = ICO.loupe;

  if (niv){
    document.title = niv.court + ' — Bibliothèque';
    document.getElementById('badge').textContent = niv.court;
    document.getElementById('fil').insertAdjacentHTML('beforeend',
      `<i>/</i><a href="niveau.html?n=${niv.slug}">${niv.court}</a><i>/</i><b>${ETAT.type ? RAYONS[ETAT.type].titre : 'Tout'}</b>`);
    document.getElementById('titre').innerHTML =
      (ETAT.type ? RAYONS[ETAT.type].titre : 'Tous les documents') + ' <span class="violet-txt">· ' + niv.court + '</span>';
    document.getElementById('sous').textContent = ETAT.type ? RAYONS[ETAT.type].desc : niv.sous;
    document.getElementById('retour').href = 'niveau.html?n=' + niv.slug;
  } else {
    document.getElementById('sous').textContent = 'La totalité des documents du site, tous niveaux confondus.';
    document.getElementById('retour').href = 'index.html#niveaux';
    document.getElementById('retour').textContent = '← Retour aux niveaux';
  }

  /* Filtres */
  document.querySelectorAll('.puce').forEach(p => {
    p.classList.toggle('on', (p.dataset.t || '') === ETAT.type);
    p.addEventListener('click', () => {
      ETAT.type = p.dataset.t || '';
      document.querySelectorAll('.puce').forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      const u = new URL(location);
      ETAT.type ? u.searchParams.set('t', ETAT.type) : u.searchParams.delete('t');
      history.replaceState({}, '', u);
      if (niv){
        document.getElementById('titre').innerHTML =
          (ETAT.type ? RAYONS[ETAT.type].titre : 'Tous les documents') + ' <span class="violet-txt">· ' + niv.court + '</span>';
        document.getElementById('sous').textContent = ETAT.type ? RAYONS[ETAT.type].desc : niv.sous;
      }
      dessineListe();
    });
  });

  let t;
  document.getElementById('q').addEventListener('input', e => {
    clearTimeout(t);
    t = setTimeout(() => { ETAT.q = e.target.value.trim(); dessineListe(); }, 160);
  });

  dessineListe();
}
</script>
</body>
</html>
